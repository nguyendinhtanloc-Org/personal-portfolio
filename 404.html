<!doctype html>
<html lang="en">
<head>

  <link rel="stylesheet" href="styles.css?v=13">
  <script>
    (function () {
      try {
        var t = localStorage.getItem("pf-theme") || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        if (t === "dark") document.documentElement.setAttribute("data-theme", "dark");
      } catch (e) { }
    })();
  </script>
</head>
<body>
  <div id="top" tabindex="-1"></div>
  <a class="skip" href="#nf-main">Skip to content</a>

  <header class="nav">
    <div class="nav-inner">
      <a class="monogram" href="index.html">T.L.</a>
      <nav aria-label="Primary">
        <a class="nav-link" href="index.html#home">Home</a>
        <a class="nav-link" href="index.html#projects">Projects</a>
        <a class="nav-link" href="index.html#contact">Contact</a>
      </nav>
    </div>
  </header>

  <main id="nf-main">
    <section class="notfound" aria-labelledby="nf-title">
      <div class="container">
        <p class="section-index notfound-index" aria-hidden="true">404</p>
        <h1 id="nf-title" class="notfound-title">
          This page <em>wasn't found</em>.
        </h1>
        <div class="evidence" aria-label="Run log — no matching page">
          <span class="ev-label">run log · duckdb</span>
          <p class="ev-line"><span class="ev-prompt">$</span> select slug from pages where slug = <span class="ev-mute" id="nf-slug">'/…'</span>;</p>
          <p class="ev-line"><span class="ev-mute">0 rows returned · route not in the lakehouse</span></p>
        </div>
        <div class="notfound-cta">
          <a class="btn-primary" href="index.html">Back to the index</a>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer-inner">
      <p>© <span class="js-year">2026</span> Nguyễn Đình Tấn Lộc</p>
      <p class="footer-meta">Set in Inter &amp; IBM Plex Mono — no framework, no build step.</p>
    </div>
  </footer>

  <script>
    (function () {
      var slugEl = document.getElementById("nf-slug");
      if (slugEl && window.location && window.location.pathname) {
        slugEl.textContent = "'" + window.location.pathname + "'";
      }
    })();
  </script>
  <script src="js/theme.js?v=10" defer></script>
  <script src="js/navigation.js?v=10" defer></script>
